name: Container Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  container-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify runtime secrets
        env:
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          CRYPTO_KEY: ${{ secrets.CRYPTO_KEY }}
        run: |
          test -n "$COOKIE_SECRET"
          test -n "$CRYPTO_KEY"
          echo "Required runtime secrets are available to the workflow."

      - name: Build Docker image
        run: docker build -t nodegoat:${{ github.sha }} .

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            nodegoat:${{ github.sha }}
