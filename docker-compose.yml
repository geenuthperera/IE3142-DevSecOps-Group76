services:
  web:
    build: .
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      MONGODB_URI: "${MONGODB_URI}"
      COOKIE_SECRET: "${COOKIE_SECRET}"
      CRYPTO_KEY: "${CRYPTO_KEY}"
      ZAP_API_KEY: "${ZAP_API_KEY}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD}"
      SEED_USER1_PASSWORD: "${SEED_USER1_PASSWORD}"
      SEED_USER2_PASSWORD: "${SEED_USER2_PASSWORD}"
    command: sh -c "until nc -z -w 2 mongo 27017 && echo 'mongo is ready for connections' && node artifacts/db-reset.js && npm start; do sleep 2; done"
    ports:
      - "4000:4000"

  mongo:
    image: mongo:4.4
    user: mongodb
    expose:
      - 27017
